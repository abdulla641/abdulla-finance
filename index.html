<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.json"><title>Abdulla Finance</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><h1>💰 Abdulla Finance</h1></header><section id="home" class="tab"><section class="cards"><div><small>Balance</small><h2 id="balance">QAR 0</h2></div><div><small>Income</small><h2 id="income">QAR 0</h2></div><div><small>Expense</small><h2 id="expense">QAR 0</h2></div></section><section class="panel"><h3>💎 Net Worth</h3><h2 id="netWorth">QAR 0</h2></section><section class="panel"><h3>📊 Monthly Summary</h3><h2 id="summary">QAR 0</h2><canvas id="chart"></canvas></section><section class="panel"><h3>📈 Analytics</h3><div id="analytics">No expenses yet</div></section></section><section id="add" class="tab" style="display:none"><section class="panel"><h3>➕ Add Transaction</h3><input id="name" placeholder="Description"><input id="amount" type="number" placeholder="Amount"><select id="category"><option>Food</option><option>Home</option><option>Travel</option><option>Bills</option><option>Other</option></select><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select><button onclick="addTransaction()">Add</button></section><section class="panel"><h3>💎 Savings</h3><input id="saving" type="number" placeholder="Add savings amount"><button onclick="addSaving()">Save</button><h2 id="savingTotal">QAR 0</h2></section></section><section id="money" class="tab" style="display:none"><section class="panel"><h3>💳 Credit / Debit</h3><input id="person" placeholder="Person / Card name"><input id="creditAmount" type="number" placeholder="Amount"><select id="creditType"><option value="receive">🟢 Receive</option><option value="pay">🔴 Pay</option></select><button onclick="addCredit()">Add</button><ul id="creditList"></ul></section><section class="panel"><h3>🔎 Search</h3><input id="search" oninput="searchTransactions()" placeholder="Search transactions"><ul id="list"></ul></section></section><section id="settings" class="tab" style="display:none"><section class="panel"><h3>⚙️ Settings</h3><select id="currency" onchange="setCurrency()"><option>QAR</option><option>INR</option></select><button onclick="exportData()">📤 Backup Data</button></section></section><nav class="bottom-nav"><button id="nav-home" onclick="showTab('home','nav-home')">🏠<span>Home</span></button><button id="nav-add" onclick="showTab('add','nav-add')">➕<span>Add</span></button><button id="nav-money" onclick="showTab('money','nav-money')">💳<span>Money</span></button><button id="nav-settings" onclick="showTab('settings','nav-settings')">⚙️<span>Settings</span></button></nav></main><script>function showTab(id,btn){document.querySelectorAll('.tab').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.bottom-nav button').forEach(x=>x.classList.remove('active'));document.getElementById(btn).classList.add('active')}</script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="script.js"></script></body></html>
