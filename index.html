<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abdulla Finance</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>💰 Abdulla Finance</h1><section class="cards"><div><small>Balance</small><h2 id="balance">QAR 0</h2></div><div><small>Income</small><h2 id="income">QAR 0</h2></div><div><small>Expense</small><h2 id="expense">QAR 0</h2></div></section><section class="panel"><h3>Add Transaction</h3><input id="name" placeholder="Description"><input id="amount" type="number" placeholder="Amount"><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select><button onclick="addTransaction()">Add</button></section><section class="panel"><h3>💎 Savings & Investments</h3><input id="saving" type="number" placeholder="Add savings amount"><button onclick="addSaving()">Save</button><h2 id="savingTotal">QAR 0</h2></section><section class="panel"><h3>🤝 Credit / Debit Tracker</h3><input id="person" placeholder="Person / Card name"><input id="creditAmount" type="number" placeholder="Amount"><select id="creditType"><option value="receive">🟢 Receive</option><option value="pay">🔴 Pay</option></select><button onclick="addCredit()">Add</button><ul id="creditList"></ul></section><ul id="list"></ul></main><script src="script.js"></script></body></html>
